amily="Consolas, monospace" font-size="16" fill="#ffffff" textLength="120" lengthAdjust="spacingAndGlyphs">T3  PETG yellow</text><text x="244" y="238.8" font-family="Consolas, monospace" font-size="16" fill="#52db80" textLength="16" lengthAdjust="spacingAndGlyphs">G4</text><text x="13" y="290.6" font-family="Consolas, monospace" font-size="12" fill="#adb9bc" textLength="120" lengthAdjust="spacingAndGlyphs">Turn edits the gate.</text><text x="13" y="309.6" font-family="Consolas, monospace" font-size="12" fill="#adb9bc" textLength="132" lengthAdjust="spacingAndGlyphs">Changes wait for Save.</text><rect x="8" y="333" width="256" height="46" fill="#172329" stroke="none"/><text x="88" y="360.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="96" lengthAdjust="spacingAndGlyphs">EndlessSpool</text><rect x="8" y="392" width="124" height="46" fill="#172329" stroke="none"/><text x="54" y="419.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="32" lengthAdjust="spacingAndGlyphs">Save</text><rect x="140" y="392" width="124" height="46" fill="#172329" stroke="none"/><text x="178" y="419.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="48" lengthAdjust="spacingAndGlyphs">Cancel</text><line x1="8" y1="451" x2="264" y2="451" stroke="#395052" stroke-width="1"/><text x="10" y="468.6" font-family="Consolas, monospace" font-size="12" fill="#adb9bc" textLength="156" lengthAdjust="spacingAndGlyphs">Turn: select   Press: open</text></svg>