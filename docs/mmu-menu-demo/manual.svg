ily="Consolas, monospace" font-size="12" fill="#ffc45b" textLength="144" lengthAdjust="spacingAndGlyphs">This corrects MMU state.</text><text x="18" y="307.6" font-family="Consolas, monospace" font-size="12" fill="#ffc45b" textLength="156" lengthAdjust="spacingAndGlyphs">It does not move filament.</text><rect x="8" y="374" width="124" height="46" fill="#172329" stroke="none"/><text x="50" y="401.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="40" lengthAdjust="spacingAndGlyphs">Apply</text><rect x="140" y="374" width="124" height="46" fill="#172329" stroke="none"/><text x="178" y="401.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="48" lengthAdjust="spacingAndGlyphs">Cancel</text><line x1="8" y1="451" x2="264" y2="451" stroke="#395052" stroke-width="1"/><text x="10" y="468.6" font-family="Consolas, monospace" font-size="12" fill="#adb9bc" textLength="156" lengthAdjust="spacingAndGlyphs">Turn: select   Press: open</text></svg>