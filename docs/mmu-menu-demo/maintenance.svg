<svg xmlns="http://www.w3.org/2000/svg" width="272" height="480"><title>Bakım işlemleri</title><rect x="0" y="0" width="272" height="480" fill="#080808" stroke="none"/><rect x="0" y="0" width="272" height="30" fill="#102429" stroke="none"/><text x="10" y="21" font-family="Consolas, monospace" font-size="20" fill="#ffffff" textLength="10" lengthAdjust="spacingAndGlyphs">&lt;</text><text x="34" y="21" font-family="Consolas, monospace" font-size="20" fill="#ffffff" textLength="110" lengthAdjust="spacingAndGlyphs">MAINTENANCE</text><text x="10" y="48.6" font-family="Consolas, monospace" font-size="12" fill="#adb9bc" textLength="150" lengthAdjust="spacingAndGlyphs">Example: selector + servo</text><rect x="8" y="65" width="256" height="43" fill="#3175de" stroke="none"/><rect x="8" y="65" width="256" height="43" fill="none" stroke="#ffffff"/><text x="18" y="90.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="104" lengthAdjust="spacingAndGlyphs">Home selector</text><text x="252" y="90.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="8" lengthAdjust="spacingAndGlyphs">&gt;</text><line x1="10" y1="157" x2="262" y2="157" stroke="#395052" stroke-width="1"/><text x="18" y="139.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="120" lengthAdjust="spacingAndGlyphs">Check all gates</text><text x="252" y="139.8" font-family="Consolas, monospace" font-size="16" fill="#52db80" textLength="8" lengthAdjust="spacingAndGlyphs">&gt;</text><line x1="10" y1="206" x2="262" y2="206" stroke="#395052" stroke-width="1"/><text x="18" y="188.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="104" lengthAdjust="spacingAndGlyphs">Grip filament</text><text x="252" y="188.8" font-family="Consolas, monospace" font-size="16" fill="#52db80" textLength="8" lengthAdjust="spacingAndGlyphs">&gt;</text><line x1="10" y1="255" x2="262" y2="255" stroke="#395052" stroke-width="1"/><text x="18" y="237.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="128" lengthAdjust="spacingAndGlyphs">Release filament</text><text x="252" y="237.8" font-family="Consolas, monospace" font-size="16" fill="#52db80" textLength="8" lengthAdjust="spacingAndGlyphs">&gt;</text><line x1="10" y1="304" x2="262" y2="304" stroke="#395052" stroke-width="1"/><text x="18" y="286.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="104" lengthAdjust="spacingAndGlyphs">Load extruder</text><text x="252" y="286.8" font-family="Consolas, monospace" font-size="16" fill="#52db80" textLength="8" lengthAdjust="spacingAndGlyphs">&gt;</text><line x1="10" y1="353" x2="262" y2="353" stroke="#395052" stroke-width="1"/><text x="18" y="335.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="120" lengthAdjust="spacingAndGlyphs">Unload extruder</text><text x="252" y="335.8" font-family="Consolas, monospace" font-size="16" fill="#52db80" textLength="8" lengthAdjust="spacingAndGlyphs">&gt;</text><line x1="10" y1="402" x2="262" y2="402" stroke="#395052" stroke-width="1"/><text x="18" y="384.8" font-family="Consolas, monospace" font-size="16" fill="#ffffff" textLength="104" lengthAdjust="spacingAndGlyphs">Sync / motors</text><text x="252" y="384.8" font-family="Consolas, monospace" font-size="16" fill="#52db80" textLength="8" lengthAdjust="spacingAndGlyphs">&gt;</text><text x="12" y="430.6" font-family="Consolas, monospace" font-size="12" fill="#adb9bc" textLength="192" lengthAdjust="spacingAndGlyphs">Shown after unload / while idle.</text><line x1="8" y1="451" x2="264" y2="451" stroke="#395052" stroke-width="1"/><text x="10" y="468.6" font-family="Consolas, monospace" font-size="12" fill="#adb9bc" textLength="156" lengthAdjust="spacingAndGlyphs">Turn: select   Press: open</text></svg>